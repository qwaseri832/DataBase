engine:
  type: "in_memory"
  partitions: 8

wal:
  batch_size: 100
  batch_timeout: "10ms"
  segment_max_size: "10MB"
  directory: "./data/wal"

replication:
  role: "master"
  master_addr: "127.0.0.1:4400"
  sync_interval: "1s"

server:
  addr: "127.0.0.1:4200"
  max_clients: 100
  read_buffer: "4KB"
  max_message_size: "64MB"
  idle_timeout: "5m"

logging:
  level: "info"
  file: "spider.log"
